<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EcoPrompt</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="../lib/optimizer-ui.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       VIEW 1 — Dashboard (default)
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="view-dashboard" class="view">

    <header class="topbar">
      <div class="brand">
        <img src="../assets/icon-32.png" class="brand-mark" alt="" />
        <span class="brand-name">EcoPrompt</span>
      </div>

      <nav class="segmented" role="tablist" aria-label="View">
        <button class="seg seg--active" type="button" role="tab" aria-selected="true" disabled>Dashboard</button>
        <button id="open-optimizer-btn" class="seg" type="button" role="tab" aria-selected="false">Optimizer</button>
      </nav>

      <div class="topbar-actions">
        <button id="open-history-btn" class="iconbtn" type="button" title="Energy history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
        </button>
        <button id="theme-toggle" class="iconbtn" type="button" title="Switch to light mode">
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="ctrl-group">
          <button id="shrink-btn" class="iconbtn" type="button" title="Narrower">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button id="grow-btn" class="iconbtn" type="button" title="Wider">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </span>
      </div>
    </header>

    <main class="view-body">

      <!-- Hero: live energy -->
      <section class="card card--hero">
        <div class="card-label">Estimated energy</div>

        <div class="energy-value">… <span class="energy-unit">W</span></div>
        <p class="hero-note">Device rendering plus backend inference, estimated live.</p>

        <div class="status-pill">
          <span class="activity-dot" aria-hidden="true"></span>
          <span class="activity-text">Active</span>
        </div>

        <div id="ai-info" class="ai-chip hidden">
          <svg class="ai-chip-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>
          <span id="ai-model-label" class="ai-model-label"></span>
          <span id="ai-watts-label" class="ai-watts-label"></span>
        </div>
      </section>

      <!-- Equivalences -->
      <section class="card">
        <div class="card-label">Equivalent per hour</div>
        <ul class="datalist">

          <li class="datarow">
            <span class="datarow-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.9 1 1 1.7h5.2c.1-.7.5-1.3 1-1.7A6 6 0 0 0 12 3z"/></svg>
            </span>
            <span class="datarow-label">Light bulbs (6 W)</span>
            <span class="datarow-value bulbs-value">—</span>
          </li>

          <li class="datarow">
            <span class="datarow-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3s6 6.4 6 10.5A6 6 0 0 1 6 13.5C6 9.4 12 3 12 3z"/></svg>
            </span>
            <span class="datarow-label">Gallons of water</span>
            <span class="datarow-value water-value">—</span>
          </li>

          <li class="datarow">
            <span class="datarow-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 20c0-8 5-13 16-13 0 10-6 14-12 14-2 0-4-.4-4-1z"/><path d="M4 20c3-5 7-8 12-9.5"/></svg>
            </span>
            <span class="datarow-label">g CO₂ released</span>
            <span class="datarow-value co2-value">—</span>
          </li>

        </ul>
      </section>

    </main>
  </div><!-- /view-dashboard -->


  <!-- ═══════════════════════════════════════════════════════════════════════
       VIEW 2 — Prompt Optimizer
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="view-optimizer" class="view hidden">

    <header class="topbar">
      <div class="brand">
        <img src="../assets/icon-32.png" class="brand-mark" alt="" />
        <span class="brand-name">EcoPrompt</span>
      </div>

      <nav class="segmented" role="tablist" aria-label="View">
        <button id="back-btn" class="seg" type="button" role="tab" aria-selected="false">Dashboard</button>
        <button class="seg seg--active" type="button" role="tab" aria-selected="true" disabled>Optimizer</button>
      </nav>

      <div class="topbar-actions">
        <button id="theme-toggle-2" class="iconbtn" type="button" title="Switch to light mode">
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="ctrl-group">
          <button id="shrink-btn-2" class="iconbtn" type="button" title="Narrower">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button id="grow-btn-2" class="iconbtn" type="button" title="Wider">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </span>
      </div>
    </header>

    <main class="view-body">

      <!-- Optimizer UI is rendered by lib/optimizer-ui.js, shared with the
           Settings page so both surfaces cannot drift apart. -->
      <div id="optimizer-mount"></div>

      <p class="fullpage-row">
        <a href="#" id="open-fullpage" class="fullpage-link">Open in full page ↗</a>
      </p>

      <div id="status" class="status hidden"></div>

    </main>
  </div><!-- /view-optimizer -->


  <!-- Script load order matters: rules-db → token-counter → optimizer → generator → energy-estimator → api → analytics → optimizer-ui → popup -->
  <script src="../lib/prompt-rules-db.js"></script>
  <script src="../lib/token-counter.js"></script>
  <script src="../lib/prompt-optimizer.js"></script>
  <script src="../lib/prompt-generator.js"></script>
  <script src="../lib/energy-estimator.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/analytics-tracker.js"></script>
  <script src="../lib/optimizer-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
